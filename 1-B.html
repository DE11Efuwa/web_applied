<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>背景色チェンジャー</title>
</head>
<body>
  <button onclick="changeColor('lightblue')">水色</button>
  <button onclick="changeColor('pink')">ピンク</button>
  <button onclick="changeColor('yellow')">黄色</button>

  <script>
    function changeColor(color) {
      document.body.style.backgroundColor = color;
    }
  </script>
</body>
</html>
